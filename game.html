<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1923" />
    <title>Game Board — Highlife Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=12" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0f1923; color: #fff; font-family: "Sora", sans-serif; overflow: hidden; }
      #game-canvas { position: fixed; inset: 0; z-index: 0; }

      /* Top bar */
      .game-topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 20px; background: rgba(15,25,35,.85); backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,.08);
      }
      .game-topbar-left { display: flex; align-items: center; gap: 16px; }
      .game-topbar-logo { font-family: "Bebas Neue", sans-serif; font-size: 1.4rem; letter-spacing: .04em; color: #fff; text-decoration: none; }
      .game-topbar-logo span { color: #abd40a; }
      .turn-indicator { font-size: .85rem; color: #a8c4d8; }
      .turn-indicator b { color: #abd40a; }

      /* Player panels */
      .players-strip {
        position: fixed; top: 60px; left: 0; right: 0; z-index: 9;
        display: flex; gap: 8px; padding: 8px 20px; overflow-x: auto;
        background: rgba(15,25,35,.6); backdrop-filter: blur(8px);
      }
      .player-chip {
        display: flex; align-items: center; gap: 8px; padding: 8px 14px;
        border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
        white-space: nowrap; transition: all .2s;
      }
      .player-chip.active { border-color: #abd40a; background: rgba(171,212,10,.1); box-shadow: 0 0 12px rgba(171,212,10,.2); }
      .player-chip-avatar { font-size: 1.2rem; }
      .player-chip-info { display: flex; flex-direction: column; }
      .player-chip-name { font-size: .8rem; font-weight: 700; color: #fff; }
      .player-chip-hecu { font-size: .7rem; color: #abd40a; }

      /* Bottom action bar */
      .action-bar {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center; gap: 16px;
        padding: 16px 20px; background: rgba(15,25,35,.85); backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255,255,255,.08);
      }
      .dice-container { display: flex; gap: 12px; align-items: center; }
      .die {
        width: 56px; height: 56px; border-radius: 12px; background: #fff; color: #0f1923;
        display: flex; align-items: center; justify-content: center;
        font-family: "Bebas Neue", sans-serif; font-size: 2rem; font-weight: 700;
        box-shadow: 0 4px 16px rgba(0,0,0,.3); transition: transform .3s;
      }
      .die.rolling { animation: diceRoll .6s ease; }
      .die-question { background: #abd40a; color: #0f1923; border: 2px solid #8ab00a; }
      .view-controls { display: flex; gap: 6px; }
      .view-btn {
        background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
        color: #a8c4d8; cursor: pointer; font-family: "Sora", sans-serif; font-size: .75rem; font-weight: 600;
        padding: 8px 12px; transition: all .2s;
      }
      .view-btn:hover { border-color: #abd40a; color: #fff; }
      .view-btn.active { background: rgba(171,212,10,.15); border-color: #abd40a; color: #abd40a; }
      @keyframes diceRoll {
        0% { transform: rotate(0) scale(1); }
        50% { transform: rotate(180deg) scale(1.2); }
        100% { transform: rotate(360deg) scale(1); }
      }
      .roll-btn {
        background: #d02f7c; border: 0; border-radius: 99px; color: #fff; cursor: pointer;
        font-family: "Sora", sans-serif; font-size: 1rem; font-weight: 700; padding: 14px 28px;
        transition: all .2s;
      }
      .roll-btn:hover { background: #fcab10; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(252,171,16,.35); }
      .roll-btn:disabled { opacity: .4; cursor: default; transform: none; }

      /* Event modal */
      .event-modal {
        position: fixed; inset: 0; z-index: 100; display: none;
        align-items: center; justify-content: center; background: rgba(0,0,0,.7);
      }
      .event-modal.is-open { display: flex; }
      .event-card {
        background: #1e3344; border: 1px solid rgba(255,255,255,.1); border-radius: 20px;
        max-width: 440px; width: calc(100% - 40px); padding: 36px 28px; text-align: center;
      }
      .event-icon { font-size: 3rem; margin-bottom: 12px; }
      .event-title { font-family: "Bebas Neue", sans-serif; font-size: 1.8rem; color: #fff; margin-bottom: 8px; }
      .event-desc { color: #a8c4d8; font-size: .95rem; line-height: 1.6; margin-bottom: 24px; }
      .event-btn {
        background: #abd40a; border: 0; border-radius: 99px; color: #0f1923; cursor: pointer;
        font-family: "Sora", sans-serif; font-size: .95rem; font-weight: 700; padding: 12px 28px;
      }
      .event-btn:hover { background: #fcab10; color: #fff; }

      /* Loading */
      .game-loading {
        position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #0f1923;
      }
      .game-loading p { color: #a8c4d8; margin-top: 16px; }

      @media (max-width: 680px) {
        .player-chip { padding: 6px 10px; }
        .player-chip-name { font-size: .75rem; }
        .player-chip-hecu { font-size: .65rem; }
        .die { width: 40px; height: 40px; font-size: 1.3rem; }
        .dice-container { gap: 6px; }
        .roll-btn { padding: 10px 16px; font-size: .85rem; }
        .view-btn { padding: 6px 8px; font-size: .65rem; }
        .action-bar { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
      }
    </style>
  </head>
  <body>
    <div class="game-loading" id="game-loading">
      <div class="loading-spinner"></div>
      <p>Loading game board…</p>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="game-topbar">
      <div class="game-topbar-left">
        <a class="game-topbar-logo" href="index.html">Highlife<span> Games</span></a>
      </div>
      <div class="turn-indicator">Turn: <b id="turn-player">—</b></div>
    </div>

    <div class="players-strip" id="players-strip"></div>

    <div class="action-bar">
      <div class="dice-container">
        <div class="die" id="die-1">?</div>
        <div class="die" id="die-2">?</div>
        <div class="die die-question" id="question-die">?</div>
      </div>
      <button class="roll-btn" id="roll-btn">Roll Dice</button>
      <div class="view-controls">
        <button class="view-btn active" data-view="0">View 1</button>
        <button class="view-btn" data-view="1">View 2</button>
        <button class="view-btn" data-view="2">View 3</button>
        <button class="view-btn" data-view="3">View 4</button>
      </div>
    </div>

    <div class="event-modal" id="event-modal">
      <div class="event-card">
        <div class="event-icon" id="event-icon">🎲</div>
        <h2 class="event-title" id="event-title">Square</h2>
        <p class="event-desc" id="event-desc">You landed here.</p>
        <button class="event-btn" id="event-btn">Continue</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="js/game-board.js"></script>
  </body>
</html>
